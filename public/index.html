<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paciente IA</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-container">

    <div class="header">
      <div class="header-top">
        <h2>Paciente IA</h2>
        <span id="profileName">Paciente virtual</span>
      </div>
      <select id="patientSelect" class="profile-select">
        <option value="">Cargando pacientes...</option>
      </select>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <textarea
        id="message"
        placeholder="Escribe como psicólogo..."
      ></textarea>

      <div class="input-controls">
        <button
          id="speechButton"
          class="icon-button"
          type="button"
          aria-label="Iniciar dictado"
          aria-pressed="false"
          title="Iniciar dictado"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path>
          </svg>
        </button>
        <button id="sendButton" type="button">
          Enviar
        </button>
      </div>
    </div>
    <p id="speechStatus" class="speech-status" role="status" aria-live="polite"></p>

  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
